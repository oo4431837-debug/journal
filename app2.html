<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>دفتر صفقات الكريبتو</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin:auto;padding:12px 12px 84px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}

.p{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.s{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:transparent}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:13px}
.big{font-size:19px;font-weight:600}
.err{color:var(--dn);font-size:13px;min-height:18px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

nav button.on{color:var(--ac);font-weight:600}nav b{display:block;font-size:19px;line-height:1.2}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:start;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}svg{width:100%;height:120px}
.chat{min-height:160px}.b{padding:8px 10px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:92%}
.b.u{background:var(--ac);color:#fff;margin-inline-start:auto}.b.a{background:var(--card);border:1px solid var(--bd)}
[hidden]{display:none!important}
.av{width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.hl{border-color:var(--ac)}
.li{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:16px}
.rbox{min-width:64px;text-align:center;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.rbox b{font-size:18px;display:block}
.idea.up{border-inline-start:4px solid var(--up)}.idea.dn{border-inline-start:4px solid var(--dn)}.idea.ac{border-inline-start:4px solid var(--ac)}
.ac{color:var(--ac)}
.bar{height:8px;border-radius:99px;background:var(--dn);overflow:hidden}.bar i{display:block;height:100%;background:var(--up)}
.bar.risk{background:var(--bd)}.bar.risk i{background:var(--dn)}.bar.risk.good i{background:var(--up)}
.qa{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px}.qa b{font-size:18px}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);

(async () => {

// ---------- calculations ----------
const dir = (t) => (t.side === 'long' ? 1 : -1);
function calc(t) {

function validate(t) {

}
function sum(vals) {
  const w = vals.filter((x) => x > 0), l = vals.filter((x) => x < 0), gw = w.reduce((a, b) => a + b, 0), gl = -l.reduce((a, b) => a + b, 0);
  let eq = 0, pk = 0, dd = 0; const curve = [0];
  vals.forEach((x) => { eq += x; curve.push(eq); pk = Math.max(pk, eq); dd = Math.max(dd, pk - eq); });
  return { n: vals.length, win: w.length + l.length ? w.length / (w.length + l.length) : null, exp: vals.length ? eq / vals.length : null, pf: gl ? gw / gl : null, net: eq, dd, curve };
}
function stats(paper = false) {
  const rows = S.trades.filter((t) => !!t.paper === paper && t.status === 'closed' && t.exit != null).sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0)).map((t) => ({ t, ...calc(t) }));
  const by = (key) => { const m = {}; rows.forEach((x) => { (m[x.t[key] || 'بدون'] = m[x.t[key] || 'بدون'] || []).push(x); }); return Object.entries(m).map(([k, a]) => ({ k, R: sum(a.map((x) => x.r || 0)), P: sum(a.map((x) => x.pnl)) })).sort((a, b) => b.P.net - a.P.net); };
  return { rows, R: sum(rows.map((x) => x.r || 0)), P: sum(rows.map((x) => x.pnl)), bySym: by('symbol'), byStr: by('strategy') };
}
const curve = (pts) => {

  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map((v, i) => `${(i / Math.max(pts.length - 1, 1)) * 300},${95 - ((v - mn) / (mx - mn)) * 90}`).join(' ')}"/></svg>`;
};
function sessions() {

  const S3 = [['آسيا', 0, 9], ['لندن', 7, 16], ['نيويورك', 12, 21]];
  return S3.map(([n, a, b]) => { const on = h >= a && h < b; return `<div class="row"><span>${n}</span><span class="mut">${String(a).padStart(2, '0')}:00 إلى ${String(b).padStart(2, '0')}:00 UTC</span><span class="tag ${on ? 'up' : ''}">${on ? 'مفتوحة' : 'مغلقة'}</span></div>`; }).join('');
}

// ---------- UI state ----------

const seg = (items, cur, act) => `<div class="seg">${items.map(([k, t]) => `<button class="${k === cur ? 'on' : ''}" data-a="${act}" data-k="${k}">${t}</button>`).join('')}</div>`;

const DIR = [

    ['community', '☺', 'المجتمع والدوري', 'نقاش وتحديات ولوحة متصدرين', 'soon:community'],
  ]],
];
const SOON = {
  charts: 'تحتاج خادماً يجلب شموع Binance ويرسمها. هذه الصفحة المنشورة لا تستطيع الاتصال بمواقع خارجية، وهو الجزء التالي في المشروع.',

};
const PT = { watch: 'قائمة المتابعة', alerts: 'تنبيهات الأسعار', sessions: 'جلسات السوق', calc: 'أدوات التداول', conv: 'محوّل الكريبتو', trades: 'يوميات التداول', stats: 'تحليلات اليوميات', strategies: 'أداء استراتيجياتي', capital: 'رأس المال', guard: 'حارس الحساب الممول', paper: 'تداول افتراضي', idealog: 'سجل أفكاري', ideaperf: 'أداء الأفكار', copy: 'دليل نسخ الصفقات', risk: 'قواعد إدارة المخاطرة', soon: 'قريباً', ach: 'الإنجازات' };

function ensure() {

const row = (a, b, k) => `<div class="row"><span class="mut">${a}</span><b class="${k || ''}">${b}</b></div>`;
function marketBlock() {

}

  } catch (e) { $('#mk-tick').textContent = 'تعذر تحميل البيانات'; }
}
function ideaCard(i) {

  const det = open ? `<div style="margin-top:8px">${row('الدخول', f(i.entry, 6))}${row('الوقف', f(i.stop, 6))}${row('الأهداف', (i.tps || []).map((p, k) => f(p, 6) + ' (' + f(c.rrs[k], 1) + 'R)').join('، ') || '-')}

function calcOut() {
  const c = ui.c, o = (n, h) => { const e = $('#co' + n); if (e) e.innerHTML = h; };
  const row = (a, b, k) => `<div class="row"><span class="mut">${a}</span><b class="${k || ''}">${b}</b></div>`;
  const ok = c.entry > 0 && c.stop > 0 && c.entry !== c.stop, side = c.stop < c.entry ? 'long' : 'short', mmr = 0.005;
  const liq = (lev) => (side === 'long' ? c.entry * (1 - 1 / lev + mmr) : c.entry * (1 + 1 / lev - mmr));
  if (!ok) { o(1, '<span class="mut">أدخل الدخول والوقف.</span>'); o(2, '<span class="mut">أدخل الدخول والوقف.</span>'); }
  else {
    const risk = (c.bal * c.risk) / 100, fee = (c.fee || 0) / 100, qty = risk / (Math.abs(c.entry - c.stop) + (c.entry + c.stop) * fee), usd = qty * c.entry;
    o(1, row('الاتجاه', SIDE[side], side === 'long' ? 'up' : 'dn') + row('المبلغ المعرّض', f(risk) + ' $') + row('الكمية', f(qty, 6)) + row('الحجم', f(usd) + ' $') + row('الهامش', f(usd / c.lev) + ' $') + row('التصفية التقريبية', f(liq(c.lev), 4), 'dn')
      + ((side === 'long' ? liq(c.lev) >= c.stop : liq(c.lev) <= c.stop) ? '<div class="err">تحذير: التصفية أقرب من الوقف، خفّض الرافعة.</div>' : ''));
    const q2 = ui.c.mode === 'usd' ? c.size / c.entry : c.size, r2 = q2 * Math.abs(c.entry - c.stop);
    o(2, q2 > 0 ? row('الكمية', f(q2, 6)) + row('الحجم', f(q2 * c.entry) + ' $') + row('المخاطرة', f(r2) + ' $', 'dn') + row('نسبة من الرصيد', f((r2 / c.bal) * 100) + '%') : '<span class="mut">أدخل الحجم.</span>');
  }
  const rr = ok && c.tgt > 0 ? Math.abs(c.tgt - c.entry) / Math.abs(c.entry - c.stop) : null;
  o(3, rr == null ? '<span class="mut">أدخل الدخول والوقف والهدف.</span>' : row('R:R', '1 : ' + f(rr)) + row('نسبة الربح اللازمة للتعادل', f(100 / (1 + rr), 1) + '%'));
  const d = c.dd / 100;
  o(4, d > 0 && d < 1 ? row('الربح المطلوب للتعويض', f((d / (1 - d)) * 100, 1) + '%', 'up') + `<div class="mut">${[5, 10, 20, 30, 50].map((x) => x + '% ← ' + f((x / (100 - x)) * 100, 1) + '%').join(' · ')}</div>` : '<span class="mut">أدخل نسبة بين 0 و100.</span>');
}

  msgs[msgs.length - 1].content = context() + '\n\nالسؤال: ' + q;
  try {
    const res = await sample(msgs, { cache: false, onText: ({ text }) => { ui.chat[idx].t = text; const b = $('#m' + idx); if (b) b.textContent = text; } });
    ui.chat[idx].t = res.text;
  } catch (e) { ui.chat[idx].t = e && e.code === 'not_granted' ? 'تم رفض الإذن. يمكنك المحاولة لاحقاً.' : 'تعذر الحصول على رد الآن.'; }
  ui.busy = false; render();
}

// ---------- render ----------
Object.assign(ui, { page: null, soon: null, q: '', hist: false, open: null, ideaForm: null });
Object.assign(ui.c, { cs: 1000, cr: 5, cm: 12, ca: '', cp: '' });
const _co = calcOut;
calcOut = function () {
  _co();
  const c = ui.c, o = (n, h) => { const e = $('#co' + n); if (e) e.innerHTML = h; };
  const notional = c.mode === 'usd' ? c.size : c.size * c.entry;
  o(5, notional > 0 && c.lev >= 1 ? row('قيمة المركز', f(notional) + ' $') + row('الهامش المطلوب', f(notional / c.lev) + ' $') : '<span class="mut">أدخل الحجم والسعر والرافعة.</span>');
  const v = c.cs * Math.pow(1 + c.cr / 100, c.cm);
  o(6, c.cs > 0 && c.cm >= 0 ? row('القيمة بعد المدة', f(v) + ' $', 'up') + row('الربح', f(v - c.cs) + ' $') : '<span class="mut">أدخل القيم.</span>');
  o(7, c.ca > 0 && c.cp > 0 ? row('القيمة', f(c.ca * c.cp) + ' USDT') + row('عكسياً: USDT لكل وحدة', f(1 / c.cp, 8)) : '<span class="mut">أدخل الكمية والسعر.</span>');
};
function openIdea(i) {
  ui.ideaForm = i ? { id: i.id } : {}; form = null;
  const t = i || { symbol: 'BTCUSDT', tf: '1h', side: 'long', sizeMode: 'qty', tps: [] };
  const tps = (t.tps && t.tps.length ? t.tps : ['', '']).map((p) => `<input class="tp" type="number" inputmode="decimal" step="any" value="${p}">`).join('');
  const s = $('#sheet');
  s.innerHTML = `<h2>${i ? 'تعديل فكرة' : 'فكرة جديدة'}</h2><div class="grid">
  <label>الزوج<input id="i-sym" value="${esc(t.symbol)}" list="pairs" autocapitalize="characters"></label>
  <label>الإطار الزمني<select id="i-tf">${['1m', '5m', '15m', '1h', '4h', '1d', '1w'].map((x) => `<option ${x === t.tf ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
  <label>الاتجاه<select id="i-side"><option value="long" ${t.side === 'long' ? 'selected' : ''}>شراء Long</option><option value="short" ${t.side === 'short' ? 'selected' : ''}>بيع Short</option></select></label><span></span>
  <label>سعر الدخول<input id="i-en" type="number" inputmode="decimal" step="any" value="${t.entry || ''}"></label>
  <label>وقف الخسارة<input id="i-st" type="number" inputmode="decimal" step="any" value="${t.stop || ''}"></label></div>
  <datalist id="pairs">${['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT', 'DOGEUSDT', 'FHEUSDT'].map((x) => `<option>${x}</option>`).join('')}</datalist>
  <div class="card" style="margin-top:8px"><div class="row"><b>الأهداف</b><button class="s" data-a="addtp">+ هدف</button></div><div class="grid g3" id="tps">${tps}</div></div>
  <div class="card"><b>حجم الصفقة</b><div class="grid"><label>طريقة الإدخال<select id="i-sm"><option value="qty" ${t.sizeMode !== 'usd' ? 'selected' : ''}>الكمية (وحدات)</option><option value="usd" ${t.sizeMode === 'usd' ? 'selected' : ''}>الحجم بالدولار USD</option></select></label>
  <label>الحجم<input id="i-size" type="number" inputmode="decimal" step="any" value="${(t.sizeMode === 'usd' ? t.usd : t.qty) || ''}"></label></div></div>
  <label>الاستراتيجية<input id="i-str" value="${esc(t.strategy)}"></label><label style="margin-top:8px">سبب الفكرة<textarea id="i-why" rows="2">${esc(t.reason)}</textarea></label>
  <label style="margin-top:8px">ملاحظة<input id="i-note" value="${esc(t.note)}"></label>
  <div class="card" id="i-prev" style="margin-top:10px"></div><div class="err" id="i-err"></div>
  <div class="row"><button class="p" data-a="isave">حفظ الفكرة</button><button class="s" style="margin-top:10px" data-a="cancel">إلغاء</button></div>`;
  s.hidden = false; s.scrollTop = 0; ideaPrev();
}
function ideaPrev() {
  const g = (i) => { const e = $('#' + i); return e ? e.value : ''; }, e = $('#i-prev'); if (!e) return;
  const en = num(g('i-en')), st = num(g('i-st')), sz = num(g('i-size')), mode = g('i-sm');
  if (!(en > 0 && st > 0 && en !== st)) { e.innerHTML = '<span class="mut">أدخل الدخول والوقف لتظهر الحسابات.</span>'; return; }
  const qty = sz > 0 ? (mode === 'qty' ? sz : sz / en) : 0, dist = Math.abs(en - st), tps = $$('.tp').map((x) => num(x.value)).filter((x) => x > 0);
  e.innerHTML = (qty > 0 ? row('الكمية', f(qty, 6)) + row('القيمة', f(qty * en) + ' $') + row('المخاطرة', f(qty * dist) + ' $ (' + f((qty * dist / S.set.balance) * 100) + '% من الرصيد)', 'dn') : '<span class="mut">أدخل الحجم لحساب المخاطرة.</span>')
    + tps.map((p, k) => row('R:R للهدف ' + (k + 1), '1 : ' + f(Math.abs(p - en) / dist), 'up')).join('');
}
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
Object.assign(act, {
  tab(d) { ui.tab = d.k; ui.page = null; ui.del = null; render(); scrollTo(0, 0); },
  back() { ui.page = null; render(); },
  open(d) {
    const it = DIR.flatMap((s) => s[2]).find((x) => x[0] === d.k), tg = it ? it[4] : 'page:' + d.k, [kind, id] = tg.split(':');
    if (kind === 'tab') { ui.tab = id; ui.page = null; } else if (kind === 'soon') { ui.page = 'soon'; ui.soon = id; } else ui.page = id;
    ui.filter = 'all'; render(); scrollTo(0, 0);
  },
  pin(d) { S.pins = S.pins.includes(d.k) ? S.pins.filter((x) => x !== d.k) : [...S.pins, d.k]; persist(); $('#dir').innerHTML = dirHtml(); },
  add(d) { openSheet(null); if (d.k === 'paper') { $('#f-paper').checked = true; } },
  cancel() { form = null; ui.ideaForm = null; $('#sheet').hidden = true; },
  ihist(d) { ui.hist = !!d.k; render(); }, iopen(d) { ui.open = ui.open === d.id ? null : d.id; render(); },
  inew() { openIdea(null); }, iedit(d) { openIdea(S.ideas.find((i) => i.id === d.id)); },
  isave() {
    const g = (i) => $('#' + i).value, mode = g('i-sm'), sz = num(g('i-size')), en = num(g('i-en'));
    const t = { kind: 'idea', symbol: g('i-sym').trim().toUpperCase(), tf: g('i-tf'), side: g('i-side'), entry: en, stop: num(g('i-st')), tps: $$('.tp').map((e) => num(e.value)).filter((x) => x > 0), sizeMode: mode, strategy: g('i-str').trim(), reason: g('i-why').trim(), note: g('i-note').trim().slice(0, 300) };
    t.qty = sz > 0 ? (mode === 'qty' ? sz : sz / en) : 0; t.usd = sz > 0 ? (mode === 'usd' ? sz : sz * en) : 0;
    const er = validate(t); if (er) { $('#i-err').textContent = er; return; }
    if (ui.ideaForm && ui.ideaForm.id) S.ideas = S.ideas.map((i) => (i.id === ui.ideaForm.id ? { ...i, ...t } : i)); else S.ideas.unshift({ ...t, id: nid(), status: 'pending', at: Date.now() });
    persist(); act.cancel(); ui.tab = 'ideas'; ui.page = null; render();
  },
  itotrade(d) {
    const i = S.ideas.find((x) => x.id === d.id); if (!i) return;
    S.ideas = S.ideas.map((x) => (x.id === i.id && x.status === 'pending' ? { ...x, status: 'active' } : x)); persist();
    openSheet({ symbol: i.symbol, tf: i.tf || '1h', side: i.side, status: 'open', sizeMode: i.sizeMode || 'qty', entry: i.entry, stop: i.stop, tps: i.tps || [], qty: i.qty, usd: i.usd, strategy: i.strategy, reason: i.reason, notes: i.note, fees: 0, openedAt: Date.now() });
  },
  wadd() { const s = $('#w-sym').value.trim().toUpperCase(); if (!/^[A-Z0-9]{3,20}$/.test(s)) { $('#w-err').textContent = 'رمز غير صالح'; return; } S.watch.unshift({ id: nid(), symbol: s, level: num($('#w-lv').value) || null, note: $('#w-note').value.trim().slice(0, 200) }); persist(); render(); },
  wdel(d) { S.watch = S.watch.filter((x) => x.id !== d.id); persist(); render(); },
  aladd() { const s = $('#al-sym').value.trim().toUpperCase(), lv = num($('#al-lv').value); if (!/^[A-Z0-9]{3,20}$/.test(s) || !(lv > 0)) { $('#al-err').textContent = 'أدخل رمزاً وسعراً صحيحين'; return; } S.alerts.unshift({ id: nid(), symbol: s, level: lv, dir: $('#al-dir').value, at: Date.now() }); persist(); render(); },
  aldel(d) { S.alerts = S.alerts.filter((x) => x.id !== d.id); persist(); render(); },
  capadd() { const a = num($('#cp-a').value); if (!(a > 0)) return; S.cap.unshift({ id: nid(), type: $('#cp-t').value, amt: a, note: $('#cp-n').value.trim().slice(0, 100), at: Date.now() }); persist(); render(); },
  capdel(d) { S.cap = S.cap.filter((x) => x.id !== d.id); persist(); render(); },
});
$('#sheet').addEventListener('input', () => { if (ui.ideaForm) ideaPrev(); });
$('#sheet').addEventListener('change', () => { if (ui.ideaForm) ideaPrev(); });
document.addEventListener('input', (e) => {
  const t = e.target, d = t.dataset || {};
  if (t.id === 'd-q') { ui.q = t.value; $('#dir').innerHTML = dirHtml(); }
  if (d.g) { S.guard[d.g] = num(t.value) || 0; persist(); }
  if (d.n) { S.set.notif[d.n] = t.checked; persist(); }
  if (d.prof) { S.set.name = t.value; persist(); }
});
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.g) render(); });
function render() {
  ensure();
  $('#nav').innerHTML = TABS.map(([k, t, i]) => `<button class="${k === ui.tab && !ui.page ? 'on' : ''}" data-a="tab" data-k="${k}"><b>${i}</b>${t}</button>`).join('');
  const v = $('#v');
  if (ui.page) {
    v.innerHTML = `<div class="row"><button class="s" data-a="back">→ رجوع</button><h2 style="margin:0">${PT[ui.page] || 'قريباً'}</h2><span></span></div><div style="height:10px"></div>` + (pages[ui.page] ? pages[ui.page]() : '');
    if (ui.page === 'calc') calcOut();
  } else v.innerHTML = views[ui.tab]();
  if (ui.tab === 'home' && !ui.page) loadMarket();
}
applyTheme(); render();
setInterval(() => { if (ui.tab === 'home' && !ui.page && $('#sheet').hidden) render(); }, 60000);
</script>
