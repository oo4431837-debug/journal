<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر صفقات الكريبتو</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1624">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الصفقات">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light dark;--bg:#f3f6f9;--card:#fff;--tx:#0f1b2a;--mut:#5b6b7c;--ac:#1f6fd6;--up:#0f8f58;--dn:#d02f47;--bd:#dce3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;margin:0;padding:0 0 84px;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical}
button{font:inherit;color:var(--tx)}
.p{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.s{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:transparent}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:13px}
.big{font-size:19px;font-weight:600}
.err{color:var(--dn);font-size:13px;min-height:18px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mut);padding:4px 0}
nav button.on{color:var(--ac);font-weight:600}nav b{display:block;font-size:19px;line-height:1.2}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:0 max(14px,calc((100% - 720px)/2)) 40px;overscroll-behavior:contain}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:start;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}svg{width:100%;height:120px}
.chat{min-height:160px}.b{padding:8px 10px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:92%}
.b.u{background:var(--ac);color:#fff;margin-inline-start:auto}.b.a{background:var(--card);border:1px solid var(--bd)}
[hidden]{display:none!important}
.av{width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
.hl{border-color:var(--ac)}
.li{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:16px}
.rbox{min-width:64px;text-align:center;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.rbox b{font-size:18px;display:block}
.idea.up{border-inline-start:4px solid var(--up)}.idea.dn{border-inline-start:4px solid var(--dn)}.idea.ac{border-inline-start:4px solid var(--ac)}
.ac{color:var(--ac)}
.bar{height:8px;border-radius:99px;background:var(--dn);overflow:hidden}.bar i{display:block;height:100%;background:var(--up)}
.bar.risk{background:var(--bd)}.bar.risk i{background:var(--dn)}.bar.risk.good i{background:var(--up)}
.qa{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px}.qa b{font-size:18px}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:30;background:var(--card);border:1px solid var(--ac);padding:10px;border-radius:10px;text-align:center}

/* ---- v2: top bar, layout, live block, responsive ---- */
#top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--bd)}
.in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:52px}
.in h1,.sbar h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.back{font-weight:600;min-height:40px;padding:6px 14px;white-space:nowrap}
.conn{font-size:11.5px;white-space:nowrap}.warn{color:#c47a0a}
main{max-width:980px;margin:0 auto;padding:12px 14px}
button{cursor:pointer;min-height:38px}.p{min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}.cards .card{margin:0}
.cols{display:grid;gap:0 14px;align-items:start}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.live{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.stc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 8px}
.stc span{display:block;font-size:11.5px;color:var(--mut)}.stc b{font-size:15px}
.oi{margin-top:10px}.oi+.oi{border-top:1px solid var(--bd);padding-top:10px}
@media(min-width:700px){main{padding:16px 20px}.p{width:auto;min-width:220px;padding:11px 26px}.cards .p,.sheet .row .p{min-width:0}}
@media(min-width:900px){
 body{padding:0 220px 0 0}
 nav{left:auto;right:0;top:0;bottom:0;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-inline-start:1px solid var(--bd);padding:16px 10px}
 nav button{flex:none;display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;text-align:start}
 nav b{display:inline-block;width:26px;font-size:18px}nav button.on{background:var(--bg)}
 .cols{grid-template-columns:1fr 1fr}
}
@media(max-width:899px) and (max-height:500px) and (orientation:landscape){
 body{padding-bottom:50px}nav button{font-size:12px;padding:2px 0}nav b{display:inline;font-size:15px;margin-inline-end:5px}.in{min-height:44px}
}

/* ---- v3: market bar, scanner, movers, calendar ---- */
.mbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.mb .sub{font-size:11.5px}.mbar .note{grid-column:1/-1;font-size:11.5px;color:var(--mut)}
.fg{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--dn),#e0a030,var(--up));position:relative;margin-top:6px}
.fg i{position:absolute;top:-3px;width:3px;height:12px;background:var(--tx);border-radius:2px}
.gf{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx);margin:4px 0}.ck input{width:auto;margin:0}
a.lk{color:var(--ac);text-decoration:none}a.lk:hover{text-decoration:underline}
.lks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
.evlog{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);font-size:12px}
.evlog div{margin-top:3px}
</style>
</head>
<body>
<header id="top"></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const f = (x, d = 2) => (x == null || !isFinite(x) ? '-' : Number(x).toLocaleString('en', { maximumFractionDigits: d }));
const cls = (x) => (x > 0 ? 'up' : x < 0 ? 'dn' : '');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => (v === '' || v == null ? NaN : parseFloat(v));
const SIDE = { long: 'شراء', short: 'بيع' };
const STAT = { pending: 'معلقة', open: 'مفتوحة', closed: 'مغلقة' };
const ISTAT = { pending: 'معلقة', active: 'نشطة', trailing: 'وقف متحرك', target: 'تحقق الهدف', stopped: 'ضرب الوقف', expired: 'انتهت' };

// ---------- state, backup & merge ----------
let S = { trades: [], ideas: [], set: { theme: 'auto', balance: 1000 } };
try { const l = JSON.parse(localStorage.getItem('tic_s') || '{}'); S = Object.assign(S, l); } catch (e) {}
let dbDoc = null, timer = null, synced = false;

function saveSnapshot(reason = 'auto') {
  try {
    const snaps = JSON.parse(localStorage.getItem('tic_snaps') || '[]');
    snaps.unshift({ id: 'sn_' + Date.now(), reason, at: Date.now(), payload: JSON.stringify(S) });
    localStorage.setItem('tic_snaps', JSON.stringify(snaps.slice(0, 15)));
  } catch (e) {}
}

function persist(snapReason) {
  try {
    if (snapReason) saveSnapshot(snapReason);
    localStorage.setItem('tic_s', JSON.stringify(S));
  } catch (e) {}
  clearTimeout(timer);
  timer = setTimeout(() => { if (dbDoc) dbDoc.set({ json: JSON.stringify(S) }).catch(() => {}); }, 700);
}

function cleanJsonText(raw) {
  let txt = String(raw || '').trim();
  if (!txt) throw new Error('النص فارغ');
  txt = txt.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
  try { return JSON.parse(txt); } catch (e) {}
  const repaired = txt.replace(/\r?\n+/g, '').replace(/,\s*([}\]])/g, '$1');
  return JSON.parse(repaired);
}

function mergeStateData(incoming) {
  if (!incoming || typeof incoming !== 'object') throw new Error('صيغة JSON غير صالحة');
  const hasAny = Array.isArray(incoming.trades) || Array.isArray(incoming.ideas) || Array.isArray(incoming.watch) || Array.isArray(incoming.alerts) || Array.isArray(incoming.cap) || incoming.set || incoming.guard;
  if (!hasAny) throw new Error('لا توجد بيانات قابلة للدمج');

  saveSnapshot('before_import_merge');

  if (Array.isArray(incoming.trades)) {
    const map = new Map((S.trades || []).map((t, idx) => [t.id || ('tr_old_' + idx), t]));
    incoming.trades.forEach((t, idx) => {
      if (!t || !t.symbol) return;
      const key = t.id || (t.symbol + '_' + (t.openedAt || idx));
      map.set(key, { ...(map.get(key) || {}), ...t, id: t.id || key });
    });
    S.trades = Array.from(map.values());
  }

  if (Array.isArray(incoming.ideas)) {
    const map = new Map((S.ideas || []).map((i, idx) => [i.id || ('id_old_' + idx), i]));
    incoming.ideas.forEach((i, idx) => {
      if (!i || !i.symbol) return;
      const key = i.id || (i.symbol + '_' + (i.at || idx));
      const prev = map.get(key) || {};
      map.set(key, {
        kind: 'idea',
        status: 'pending',
        tpi: 0,
        events: [],
        ...prev,
        ...i,
        id: i.id || key,
        events: Array.isArray(i.events) && i.events.length ? i.events : (prev.events || [])
      });
    });
    S.ideas = Array.from(map.values());
  }

  if (Array.isArray(incoming.watch)) {
    const map = new Map((S.watch || []).map((w) => [w.symbol, w]));
    incoming.watch.forEach((w) => {
      if (!w || !w.symbol) return;
      const sym = String(w.symbol).toUpperCase();
      map.set(sym, { id: w.id || ('w_' + sym), symbol: sym, level: w.level ?? null, note: w.note || '', ...(map.get(sym) || {}), ...w, symbol: sym });
    });
    S.watch = Array.from(map.values());
  }

  if (Array.isArray(incoming.alerts)) {
    const map = new Map((S.alerts || []).map((a) => [a.id, a]));
    incoming.alerts.forEach((a) => {
      if (!a || !a.symbol || !(a.level > 0)) return;
      const id = a.id || ('al_' + a.symbol + '_' + a.level);
      map.set(id, { ...(map.get(id) || {}), ...a, id });
    });
    S.alerts = Array.from(map.values());
  }

  if (Array.isArray(incoming.cap)) {
    const map = new Map((S.cap || []).map((c) => [c.id, c]));
    incoming.cap.forEach((c) => {
      if (!c || !(c.amt > 0)) return;
      const id = c.id || ('cp_' + (c.at || Math.random().toString(36).slice(2, 7)));
      map.set(id, { ...(map.get(id) || {}), ...c, id });
    });
    S.cap = Array.from(map.values());
  }

  if (incoming.set && typeof incoming.set === 'object') {
    S.set = { ...S.set, ...incoming.set, notif: { ...(S.set.notif || {}), ...(incoming.set.notif || {}) } };
  }
  if (incoming.guard && typeof incoming.guard === 'object') {
    S.guard = { ...S.guard, ...incoming.guard };
  }

  persist();
}

(async () => {
  try {
    if (typeof claude === 'undefined') return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    dbDoc = db.doc('data/users/' + (await user.id()) + '/journal');
    const snap = await dbDoc.get();
    if (snap.exists) { S = Object.assign({ trades: [], ideas: [], set: S.set }, JSON.parse(snap.data().json)); try { localStorage.setItem('tic_s', JSON.stringify(S)); } catch (e) {} }
    else if (S.trades.length || S.ideas.length) persist();
    synced = true; applyTheme(); render();
  } catch (e) {}
})();

// ---------- calculations ----------
const dir = (t) => (t.side === 'long' ? 1 : -1);
function calc(t) {
  const qty = t.sizeMode === 'usd' ? t.usd / t.entry : t.qty, usd = qty * t.entry, dist = Math.abs(t.entry - t.stop), risk = dist * qty;
  const rrs = (t.tps || []).map((p) => Math.abs(p - t.entry) / dist);
  let pnl = null, r = null;
  if (t.exit != null) { pnl = dir(t) * (t.exit - t.entry) * qty - (t.fees || 0); r = risk ? pnl / risk : null; }
  return { qty, usd, risk, rrs, pnl, r };
}
function validate(t) {
  if (!/^[A-Z0-9]{3,20}$/.test(t.symbol)) return 'رمز غير صالح، مثال: BTCUSDT';
  if (!(t.entry > 0 && t.stop > 0)) return 'أدخل سعر الدخول ووقف الخسارة';
  if (t.side === 'long' ? t.stop >= t.entry : t.stop <= t.entry) return 'وقف الخسارة يجب أن يكون تحت الدخول للشراء وفوقه للبيع';
  if ((t.tps || []).some((p) => (t.side === 'long' ? p <= t.entry : p >= t.entry))) return 'الأهداف يجب أن تكون في اتجاه الربح';
  if (t.kind !== 'idea') {
    if (!((t.sizeMode === 'usd' ? t.usd : t.qty) > 0)) return 'أدخل حجم الصفقة';
    if (t.status === 'closed' && !(t.exit > 0)) return 'أدخل سعر الخروج للصفقة المغلقة';
  }
  return '';
}
function sum(vals) {
  const w = vals.filter((x) => x > 0), l = vals.filter((x) => x < 0), gw = w.reduce((a, b) => a + b, 0), gl = -l.reduce((a, b) => a + b, 0);
  let eq = 0, pk = 0, dd = 0; const curve = [0];
  vals.forEach((x) => { eq += x; curve.push(eq); pk = Math.max(pk, eq); dd = Math.max(dd, pk - eq); });
  return { n: vals.length, win: w.length + l.length ? w.length / (w.length + l.length) : null, exp: vals.length ? eq / vals.length : null, pf: gl ? gw / gl : null, net: eq, dd, curve };
}
function stats(paper = false) {
  const rows = S.trades.filter((t) => !!t.paper === paper && t.status === 'closed' && t.exit != null).sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0)).map((t) => ({ t, ...calc(t) }));
  const by = (key) => { const m = {}; rows.forEach((x) => { (m[x.t[key] || 'بدون'] = m[x.t[key] || 'بدون'] || []).push(x); }); return Object.entries(m).map(([k, a]) => ({ k, R: sum(a.map((x) => x.r || 0)), P: sum(a.map((x) => x.pnl)) })).sort((a, b) => b.P.net - a.P.net); };
  return { rows, R: sum(rows.map((x) => x.r || 0)), P: sum(rows.map((x) => x.pnl)), bySym: by('symbol'), byStr: by('strategy') };
}
const curve = (pts) => {
  const mx = Math.max(...pts, 1), mn = Math.min(...pts, -1);
  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map((v, i) => `${(i / Math.max(pts.length - 1, 1)) * 300},${95 - ((v - mn) / (mx - mn)) * 90}`).join(' ')}"/></svg>`;
};
function sessions() {
  const h = new Date().getUTCHours() + new Date().getUTCMinutes() / 60;
  const S3 = [['آسيا', 0, 9], ['لندن', 7, 16], ['نيويورك', 12, 21]];
  return S3.map(([n, a, b]) => { const on = h >= a && h < b; return `<div class="row"><span>${n}</span><span class="mut">${String(a).padStart(2, '0')}:00 إلى ${String(b).padStart(2, '0')}:00 UTC</span><span class="tag ${on ? 'up' : ''}">${on ? 'مفتوحة' : 'مغلقة'}</span></div>`; }).join('');
}

// ---------- UI state ----------
const ui = { tab: 'home', sub: 'trades', filter: 'all', del: null, chat: [], busy: false, c: { bal: 1000, risk: 1, entry: '', stop: '', fee: 0.05, lev: 5, mode: 'qty', size: '', tgt: '', dd: 20 } };
const TABS = [['home', 'الرئيسية', '⌂'], ['ideas', 'الأفكار', '✦'], ['desk', 'المكتب', '▤'], ['ai', 'المستشار', '◉'], ['me', 'الملف', '☺']];
function applyTheme() { const r = document.documentElement; if (S.set.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme); }
const seg = (items, cur, act) => `<div class="seg">${items.map(([k, t]) => `<button class="${k === cur ? 'on' : ''}" data-a="${act}" data-k="${k}">${t}</button>`).join('')}</div>`;

const DIR = [
  ['خطط صفقة', 'أفكار التداول والحاسبات والمفكرة', [
    ['ideas', '✦', 'أفكار التداول', 'خططك وحالة كل فكرة', 'tab:ideas'],
    ['scanner', '⌕', 'ماسح الفرص', 'شروط MA50/MA200 وRSI والحجم على عملات واسعة', 'page:scanner'],
    ['movers', '⇅', 'الرابحون والسيولة وRSI', 'الأكثر نشاطاً وتشبع RSI', 'page:movers'],
    ['advisor', '◉', 'مستشار التداول الذكي', 'تحليل يومياتك عبر Claude', 'tab:ai'],
    ['charts', '▥', 'الرسوم البيانية', 'شموع مباشرة للعملات', 'page:charts'],
    ['watch', '◎', 'قائمة المتابعة', 'عملاتك ومستوياتها', 'page:watch'],
    ['alerts', '🔔', 'تنبيهات الأسعار', 'تنبيهات لمستويات الأسعار', 'page:alerts'],
    ['calendar', '▦', 'التقويم الاقتصادي', 'الفائدة والتضخم والوظائف + أخبار السوق', 'page:calendar'],

function calcOut() {
  const c = ui.c, o = (n, h) => { const e = $('#co' + n); if (e) e.innerHTML = h; };
  const row = (a, b, k) => `<div class="row"><span class="mut">${a}</span><b class="${k || ''}">${b}</b></div>`;
  const ok = c.entry > 0 && c.stop > 0 && c.entry !== c.stop, side = c.stop < c.entry ? 'long' : 'short', mmr = 0.005;
  const liq = (lev) => (side === 'long' ? c.entry * (1 - 1 / lev + mmr) : c.entry * (1 + 1 / lev - mmr));
  if (!ok) { o(1, '<span class="mut">أدخل الدخول والوقف.</span>'); o(2, '<span class="mut">أدخل الدخول والوقف.</span>'); }
  else {
    const risk = (c.bal * c.risk) / 100, fee = (c.fee || 0) / 100, qty = risk / (Math.abs(c.entry - c.stop) + (c.entry + c.stop) * fee), usd = qty * c.entry;
    o(1, row('الاتجاه', SIDE[side], side === 'long' ? 'up' : 'dn') + row('المبلغ المعرّض', f(risk) + ' $') + row('الكمية', f(qty, 6)) + row('الحجم', f(usd) + ' $') + row('الهامش', f(usd / c.lev) + ' $') + row('التصفية التقريبية', f(liq(c.lev), 4), 'dn')
      + ((side === 'long' ? liq(c.lev) >= c.stop : liq(c.lev) <= c.stop) ? '<div class="err">تحذير: التصفية أقرب من الوقف، خفّض الرافعة.</div>' : ''));
    const q2 = ui.c.mode === 'usd' ? c.size / c.entry : c.size, r2 = q2 * Math.abs(c.entry - c.stop);
    o(2, q2 > 0 ? row('الكمية', f(q2, 6)) + row('الحجم', f(q2 * c.entry) + ' $') + row('المخاطرة', f(r2) + ' $', 'dn') + row('نسبة من الرصيد', f((r2 / c.bal) * 100) + '%') : '<span class="mut">أدخل الحجم.</span>');
  }
  const rr = ok && c.tgt > 0 ? Math.abs(c.tgt - c.entry) / Math.abs(c.entry - c.stop) : null;
  o(3, rr == null ? '<span class="mut">أدخل الدخول والوقف والهدف.</span>' : row('R:R', '1 : ' + f(rr)) + row('نسبة الربح اللازمة للتعادل', f(100 / (1 + rr), 1) + '%'));
  const d = c.dd / 100;
  o(4, d > 0 && d < 1 ? row('الربح المطلوب للتعويض', f((d / (1 - d)) * 100, 1) + '%', 'up') + `<div class="mut">${[5, 10, 20, 30, 50].map((x) => x + '% ← ' + f((x / (100 - x)) * 100, 1) + '%').join(' · ')}</div>` : '<span class="mut">أدخل نسبة بين 0 و100.</span>');
}

const ema = (v, n) => { const o = v.map(() => null); if (v.length < n) return o; const a = 2 / (n + 1); let p = v.slice(0, n).reduce((x, y) => x + y, 0) / n; o[n - 1] = p; for (let i = n; i < v.length; i++) { p = a * v[i] + (1 - a) * p; o[i] = p; } return o; };
const rsi = (c, n = 14) => { const o = c.map(() => null); if (c.length <= n) return o; let g = 0, l = 0; for (let i = 1; i <= n; i++) { const d = c[i] - c[i - 1]; g += Math.max(d, 0); l += Math.max(-d, 0); } g /= n; l /= n; const val = () => (l === 0 ? (g === 0 ? 50 : 100) : 100 - 100 / (1 + g / l)); o[n] = val(); for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; o[i] = val(); } return o; };
const atr = (h, l, c, n = 14) => { const tr = h.map((x, i) => (i === 0 ? x - l[i] : Math.max(x - l[i], Math.abs(x - c[i - 1]), Math.abs(l[i] - c[i - 1])))); const o = tr.map(() => null); if (tr.length < n) return o; let p = tr.slice(0, n).reduce((a, b) => a + b, 0) / n; o[n - 1] = p; for (let i = n; i < tr.length; i++) { p = (p * (n - 1) + tr[i]) / n; o[i] = p; } return o; };
function pivots(k, w = 5) {
  const hs = [], ls = [];
  for (let i = w; i < k.length - w; i++) { let ph = true, pl = true; for (let j = 1; j <= w; j++) { if (k[i].h <= k[i - j].h || k[i].h <= k[i + j].h) ph = false; if (k[i].l >= k[i - j].l || k[i].l >= k[i + j].l) pl = false; } if (ph) hs.push(k[i].h); if (pl) ls.push(k[i].l); }
  return { hs, ls };
}

// idea lifecycle on closed candles (pessimistic: stop before targets; entry candle checks stop only)
function stepIdea(i, c) {
  const long = i.side === 'long';
  let s = { ...i };
  if (s.trailingStop == null) s.trailingStop = s.stop;
  if (s.tpi == null) s.tpi = 0;
  let justEntered = false;

  if (s.status === 'pending') {
    if (!(c.l <= s.entry && s.entry <= c.h)) return s;
    s.status = 'active';
    justEntered = true;
    addIdeaEvent(s, 'entry_hit', 'تفعيل الدخول (نشطة)', s.entry, c.ct || c.t);
  }

  if (s.status === 'active' || s.status === 'trailing') {
    const hitStop = long ? c.l <= s.trailingStop : c.h >= s.trailingStop;
    if (hitStop) {
      const isTrail = s.trailingStop !== s.stop;
      s.status = 'stopped';
      s.resR = (long ? (s.trailingStop - s.entry) : (s.entry - s.trailingStop)) / Math.abs(s.entry - s.stop);
      addIdeaEvent(s, isTrail ? 'trailing_hit' : 'stop_hit', isTrail ? 'ضرب الوقف المتحرك' : 'ضرب وقف الخسارة', s.trailingStop, c.ct || c.t);
      return s;
    }

    if (!justEntered && Array.isArray(s.tps) && s.tps.length) {
      while (s.tpi < s.tps.length && (long ? c.h >= s.tps[s.tpi] : c.l <= s.tps[s.tpi])) {
        const hitIdx = s.tpi + 1;
        const tpPrice = s.tps[s.tpi];
        addIdeaEvent(s, 'tp_' + hitIdx, 'تحقق الهدف ' + hitIdx + ' (TP' + hitIdx + ')', tpPrice, c.ct || c.t);
        if (s.tpi === s.tps.length - 1) {
          s.status = 'target';
          s.resR = Math.abs(tpPrice - s.entry) / Math.abs(s.entry - s.stop);
          return s;
        }
        s.tpi++;
        s.status = 'trailing';
        const nextTrail = s.tpi === 1 ? s.entry : s.tps[s.tpi - 2];
        if (long) s.trailingStop = Math.max(s.trailingStop, nextTrail);
        else s.trailingStop = Math.min(s.trailingStop, nextTrail);
        addIdeaEvent(s, 'trail_move_' + s.tpi, 'تحديث الوقف المتحرك إلى ' + f(s.trailingStop, 6), s.trailingStop, c.ct || c.t);
      }
    }
  }
  return s;
}

function stepIdeaLivePrice(i, px) {
  if (!(px > 0)) return i;
  const long = i.side === 'long';
  let s = { ...i };
  if (s.trailingStop == null) s.trailingStop = s.stop;
  if (s.tpi == null) s.tpi = 0;
  let changed = false;

  if (s.status === 'pending') {
    const hitEntry = long ? px <= s.entry : px >= s.entry;
    if (hitEntry) {
      s.status = 'active';
      addIdeaEvent(s, 'entry_hit', 'تفعيل الدخول بالسعر المباشر', px, Date.now());
      changed = true;
    }
  }

  if (s.status === 'active' || s.status === 'trailing') {
    if (long ? px <= s.trailingStop : px >= s.trailingStop) {
      const isTrail = s.trailingStop !== s.stop;
      s.status = 'stopped';
      s.resR = (long ? (s.trailingStop - s.entry) : (s.entry - s.trailingStop)) / Math.abs(s.entry - s.stop);
      addIdeaEvent(s, isTrail ? 'trailing_hit' : 'stop_hit', isTrail ? 'ضرب الوقف المتحرك' : 'ضرب وقف الخسارة', px, Date.now());
      changed = true;
    } else if (Array.isArray(s.tps) && s.tps.length) {
      while (s.tpi < s.tps.length && (long ? px >= s.tps[s.tpi] : px <= s.tps[s.tpi])) {
        const hitIdx = s.tpi + 1;
        const tpPrice = s.tps[s.tpi];
        addIdeaEvent(s, 'tp_' + hitIdx, 'تحقق الهدف ' + hitIdx + ' (TP' + hitIdx + ')', px, Date.now());
        changed = true;
        if (s.tpi === s.tps.length - 1) {
          s.status = 'target';
          s.resR = Math.abs(tpPrice - s.entry) / Math.abs(s.entry - s.stop);
          break;
        }

Object.assign(act, {

const stKey = (s) => (s && s.p ? 'p:' + s.p + (s.p === 'soon' ? s.s : '') : 't:' + ((s && s.t) || 'home'));
const curKey = () => stKey(snap());

function go(mut, top) {

function showSheet(s) { if (s.hidden) history.pushState({ ...snap(), sh: 1 }, ''); s.hidden = false; s.scrollTop = 0; }
function closeSheet(after) {
  const s = $('#sheet'), was = !s.hidden; form = null; ui.ideaForm = null; s.hidden = true;
  if (was && history.state && history.state.sh) { pend = after || null; history.back(); } else if (after) after();
}
addEventListener('popstate', (e) => {
  const st = e.state || { t: 'home', p: null, s: null }, s = $('#sheet'), fn = pend; pend = null;
  if (!s.hidden) { form = null; ui.ideaForm = null; s.hidden = true; }
  if (stKey(st) !== curKey()) { scrollMap[curKey()] = window.scrollY; ui.tab = st.t; ui.page = st.p; ui.soon = st.s; render(); restoreY(scrollMap[curKey()] || 0); }
  else if (!fn) render();
  if (fn) fn();
});
function restoreY(y) { window.scrollTo(0, y); ui.pendY = y > 0 ? y : null; clearTimeout(ui.pyT); ui.pyT = setTimeout(() => { ui.pendY = null; }, 6000); }
function settle() { if (ui.pendY != null && document.documentElement.scrollHeight - innerHeight >= ui.pendY - 1) { window.scrollTo(0, ui.pendY); ui.pendY = null; } }
new MutationObserver(settle).observe($('#v'), { childList: true, subtree: true });
['wheel', 'touchstart', 'keydown'].forEach((n) => addEventListener(n, () => { ui.pendY = null; }, { passive: true }));
history.replaceState(snap(), '');
setInterval(updateLive, 2000);
Object.assign(act, {

  back() { if (history.state && history.state.p) history.back(); else go(() => { ui.page = null; }, false); },
  open(d) {
