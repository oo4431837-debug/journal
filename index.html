<style>
:root{color-scheme:light dark;--bg:#f3f6f9;--card:#fff;--tx:#0f1b2a;--mut:#5b6b7c;--ac:#1f6fd6;--up:#0f8f58;--dn:#d02f47;--bd:#dce3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1624;--card:#122338;--tx:#e8eef5;--mut:#8da0b5;--ac:#4aa3ff;--up:#2ecc8f;--dn:#ff6b7f;--bd:#1f3550}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;margin:0;padding:0 0 84px;font-variant-numeric:tabular-nums}
h2{font-size:17px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}
label{display:block;font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical}
button{font:inherit;color:var(--tx)}
.p{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.s{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:transparent}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;white-space:nowrap}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut);font-size:13px}
.big{font-size:19px;font-weight:600}
.err{color:var(--dn);font-size:13px;min-height:18px}

.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:0 max(14px,calc((100% - 720px)/2)) 40px;overscroll-behavior:contain}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:start;border-bottom:1px solid var(--bd)}
.wrap{overflow-x:auto}svg{width:100%;height:120px}
.chat{min-height:160px}.b{padding:8px 10px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:92%}
.b.u{background:var(--ac);color:#fff;margin-inline-start:auto}.b.a{background:var(--card);border:1px solid var(--bd)}

.ic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:16px}
.rbox{min-width:64px;text-align:center;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.rbox b{font-size:18px;display:block}
.idea.up{border-inline-start:4px solid var(--up)}.idea.dn{border-inline-start:4px solid var(--dn)}.idea.ac{border-inline-start:4px solid var(--ac)}
.ac{color:var(--ac)}

.bar.risk{background:var(--bd)}.bar.risk i{background:var(--dn)}.bar.risk.good i{background:var(--up)}

/* ---- v2: top bar, layout, live block, responsive ---- */
#top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--bd)}
.in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:52px}
.in h1,.sbar h1{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.back{font-weight:600;min-height:40px;padding:6px 14px;white-space:nowrap}
.conn{font-size:11.5px;white-space:nowrap}.warn{color:#c47a0a}
main{max-width:980px;margin:0 auto;padding:12px 14px}
button{cursor:pointer;min-height:38px}.p{min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}.cards .card{margin:0}
.cols{display:grid;gap:0 14px;align-items:start}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

<body>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const f = (x, d = 2) => (x == null || !isFinite(x) ? '-' : Number(x).toLocaleString('en', { maximumFractionDigits: d }));
const cls = (x) => (x > 0 ? 'up' : x < 0 ? 'dn' : '');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => (v === '' || v == null ? NaN : parseFloat(v));
const SIDE = { long: 'شراء', short: 'بيع' };
const STAT = { pending: 'معلقة', open: 'مفتوحة', closed: 'مغلقة' };
const ISTAT = { pending: 'معلقة', active: 'نشطة', trailing: 'وقف متحرك', target: 'تحقق الهدف', stopped: 'ضرب الوقف', expired: 'انتهت' };

// ---------- state & persistence ----------
let S = { trades: [], ideas: [], set: { theme: 'auto', balance: 1000 } };
try { const l = JSON.parse(localStorage.getItem('tic_s') || '{}'); S = Object.assign(S, l); } catch (e) {}
let dbDoc = null, timer = null, synced = false;
function persist() {
  try { localStorage.setItem('tic_s', JSON.stringify(S)); } catch (e) {}
  clearTimeout(timer);
  timer = setTimeout(() => { if (dbDoc) dbDoc.set({ json: JSON.stringify(S) }).catch(() => {}); }, 700);
}
(async () => {
  try {
    if (typeof claude === 'undefined') return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    dbDoc = db.doc('data/users/' + (await user.id()) + '/journal');
    const snap = await dbDoc.get();
    if (snap.exists) { S = Object.assign({ trades: [], ideas: [], set: S.set }, JSON.parse(snap.data().json)); try { localStorage.setItem('tic_s', JSON.stringify(S)); } catch (e) {} }
    else if (S.trades.length || S.ideas.length) persist();
    synced = true; applyTheme(); render();
  } catch (e) {}
})();

// ---------- calculations ----------
const dir = (t) => (t.side === 'long' ? 1 : -1);
function calc(t) {
  const qty = t.sizeMode === 'usd' ? t.usd / t.entry : t.qty, usd = qty * t.entry, dist = Math.abs(t.entry - t.stop), risk = dist * qty;
  const rrs = (t.tps || []).map((p) => Math.abs(p - t.entry) / dist);
  let pnl = null, r = null;
  if (t.exit != null) { pnl = dir(t) * (t.exit - t.entry) * qty - (t.fees || 0); r = risk ? pnl / risk : null; }
  return { qty, usd, risk, rrs, pnl, r };
}
function validate(t) {
  if (!/^[A-Z0-9]{3,20}$/.test(t.symbol)) return 'رمز غير صالح، مثال: BTCUSDT';
  if (!(t.entry > 0 && t.stop > 0)) return 'أدخل سعر الدخول ووقف الخسارة';
  if (t.side === 'long' ? t.stop >= t.entry : t.stop <= t.entry) return 'وقف الخسارة يجب أن يكون تحت الدخول للشراء وفوقه للبيع';
  if ((t.tps || []).some((p) => (t.side === 'long' ? p <= t.entry : p >= t.entry))) return 'الأهداف يجب أن تكون في اتجاه الربح';
  if (t.kind !== 'idea') {
    if (!((t.sizeMode === 'usd' ? t.usd : t.qty) > 0)) return 'أدخل حجم الصفقة';
    if (t.status === 'closed' && !(t.exit > 0)) return 'أدخل سعر الخروج للصفقة المغلقة';
  }
  return '';
}
function sum(vals) {
  const w = vals.filter((x) => x > 0), l = vals.filter((x) => x < 0), gw = w.reduce((a, b) => a + b, 0), gl = -l.reduce((a, b) => a + b, 0);
  let eq = 0, pk = 0, dd = 0; const curve = [0];
  vals.forEach((x) => { eq += x; curve.push(eq); pk = Math.max(pk, eq); dd = Math.max(dd, pk - eq); });
  return { n: vals.length, win: w.length + l.length ? w.length / (w.length + l.length) : null, exp: vals.length ? eq / vals.length : null, pf: gl ? gw / gl : null, net: eq, dd, curve };
}
function stats(paper = false) {
  const rows = S.trades.filter((t) => !!t.paper === paper && t.status === 'closed' && t.exit != null).sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0)).map((t) => ({ t, ...calc(t) }));
  const by = (key) => { const m = {}; rows.forEach((x) => { (m[x.t[key] || 'بدون'] = m[x.t[key] || 'بدون'] || []).push(x); }); return Object.entries(m).map(([k, a]) => ({ k, R: sum(a.map((x) => x.r || 0)), P: sum(a.map((x) => x.pnl)) })).sort((a, b) => b.P.net - a.P.net); };
  return { rows, R: sum(rows.map((x) => x.r || 0)), P: sum(rows.map((x) => x.pnl)), bySym: by('symbol'), byStr: by('strategy') };
}
const curve = (pts) => {
  const mx = Math.max(...pts, 1), mn = Math.min(...pts, -1);
  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${pts.map((v, i) => `${(i / Math.max(pts.length - 1, 1)) * 300},${95 - ((v - mn) / (mx - mn)) * 90}`).join(' ')}"/></svg>`;
};
function sessions() {
  const h = new Date().getUTCHours() + new Date().getUTCMinutes() / 60;
  const S3 = [['آسيا', 0, 9], ['لندن', 7, 16], ['نيويورك', 12, 21]];
  return S3.map(([n, a, b]) => { const on = h >= a && h < b; return `<div class="row"><span>${n}</span><span class="mut">${String(a).padStart(2, '0')}:00 إلى ${String(b).padStart(2, '0')}:00 UTC</span><span class="tag ${on ? 'up' : ''}">${on ? 'مفتوحة' : 'مغلقة'}</span></div>`; }).join('');
}

// ---------- UI state ----------
const ui = { tab: 'home', sub: 'trades', filter: 'all', del: null, chat: [], busy: false, c: { bal: 1000, risk: 1, entry: '', stop: '', fee: 0.05, lev: 5, mode: 'qty', size: '', tgt: '', dd: 20 } };
const TABS = [['home', 'الرئيسية', '⌂'], ['ideas', 'الأفكار', '✦'], ['desk', 'المكتب', '▤'], ['ai', 'المستشار', '◉'], ['me', 'الملف', '☺']];
function applyTheme() { const r = document.documentElement; if (S.set.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.set.theme); }
const seg = (items, cur, act) => `<div class="seg">${items.map(([k, t]) => `<button class="${k === cur ? 'on' : ''}" data-a="${act}" data-k="${k}">${t}</button>`).join('')}</div>`;

const DIR = [
  ['خطط صفقة', 'أفكار التداول والحاسبات والمفكرة', [
    ['ideas', '✦', 'أفكار التداول', 'خططك وحالة كل فكرة', 'tab:ideas'],
    ['scanner', '⌕', 'ماسح الفرص', 'RSI وEMA وتقاطعاتها والدعم والمقاومة', 'page:scanner'],
    ['advisor', '◉', 'مستشار التداول الذكي', 'تحليل يومياتك عبر Claude', 'tab:ai'],
    ['charts', '▥', 'الرسوم البيانية', 'شموع مباشرة للعملات', 'page:charts'],
    ['watch', '◎', 'قائمة المتابعة', 'عملاتك ومستوياتها', 'page:watch'],
    ['alerts', '🔔', 'تنبيهات الأسعار', 'تنبيهات لمستويات الأسعار', 'page:alerts'],
    ['calendar', '▦', 'التقويم الاقتصادي', 'بيانات مؤثرة وتوقعات', 'soon:calendar'],
    ['sessions', '◔', 'جلسات السوق', 'آسيا ولندن ونيويورك', 'page:sessions'],
    ['tools', '✎', 'أدوات التداول', 'حجم المركز والهامش وR:R والتراجع والفائدة المركبة', 'page:calc'],
    ['liq', '◍', 'خريطة السيولة', 'عمق دفتر الأوامر', 'page:liq'],
    ['conv', '⇄', 'محوّل الكريبتو', 'تحويل بسعر تدخله', 'page:conv'],
  ]],
  ['تابع أموالي', 'التدريب والحسابات وحدود المخاطرة', [
    ['paper', '▣', 'تداول افتراضي', 'تدرّب بأموال افتراضية بدون مخاطرة', 'page:paper'],
    ['acct', '⌂', 'حساب التداول', 'ربط Binance وBybit للقراءة فقط', 'soon:acct'],
    ['capital', '◆', 'رأس المال', 'الإيداعات والسحوبات والرصيد', 'page:capital'],
    ['guard', '⛨', 'حارس الحساب الممول', 'حدود الخسارة اليومية والإجمالية', 'page:guard'],
    ['strat', '▤', 'أداء استراتيجياتي', 'الأرباح والخسائر ونسبة الفوز', 'page:strategies'],
    ['backtest', '↺', 'مختبر الاختبار التاريخي', 'تدرّب على سجل حقيقي', 'soon:backtest'],
  ]],
  ['يومياتي', 'سجّل صفقاتك وراجعها', [
    ['trades', '✐', 'يوميات التداول', 'سجّل صفقاتك وراجعها', 'page:trades'],
    ['stats', '▮', 'تحليلات اليوميات', 'إحصاءات شاملة ومنحنيات', 'page:stats'],
  ]],
  ['تعلّم', 'أدلة ودورات', [
    ['risk', '⚖', 'قواعد إدارة المخاطرة', 'أساسيات حماية رأس المال', 'page:risk'],
    ['copy', '⧉', 'دليل نسخ الصفقات', 'ما تنتبه له قبل النسخ', 'page:copy'],
    ['acad', '🎓', 'الأكاديمية والتعليم', 'دروس ومستويات', 'soon:acad'],

  ]],
  ['سجل', 'كل فكرة أغلقناها ونتيجتها', [
    ['idealog', '▤', 'سجل أفكاري', 'كل أفكارك ونتائجها', 'page:idealog'],
    ['ideaperf', '▮', 'أداء الأفكار', 'نسبة التحقق وصافي R', 'page:ideaperf'],
  ]],
  ['المجتمع', 'الدوري والمتصدرون', [
    ['community', '☺', 'المجتمع والدوري', 'نقاش وتحديات ولوحة متصدرين', 'soon:community'],
  ]],
];
const SOON = {
  charts: 'تحتاج خادماً يجلب شموع Binance ويرسمها. هذه الصفحة المنشورة لا تستطيع الاتصال بمواقع خارجية، وهو الجزء التالي في المشروع.',
  calendar: 'التقويم الاقتصادي يحتاج مزوّد بيانات بمفتاح خاص يعمل من الخادم.',
  liq: 'خريطة السيولة تحتاج قراءة عمق دفتر الأوامر من Binance على الخادم.',
  acct: 'ربط الحساب بمفاتيح قراءة فقط يحتاج خادماً يشفّر المفاتيح ويحميها. لا تضع مفاتيحك في صفحة منشورة.',

};
const PT = { watch: 'قائمة المتابعة', alerts: 'تنبيهات الأسعار', sessions: 'جلسات السوق', calc: 'أدوات التداول', conv: 'محوّل الكريبتو', trades: 'يوميات التداول', stats: 'تحليلات اليوميات', strategies: 'أداء استراتيجياتي', capital: 'رأس المال', guard: 'حارس الحساب الممول', paper: 'تداول افتراضي', idealog: 'سجل أفكاري', ideaperf: 'أداء الأفكار', copy: 'دليل نسخ الصفقات', risk: 'قواعد إدارة المخاطرة', soon: 'قريباً', charts: 'الرسوم البيانية', liq: 'خريطة السيولة', scanner: 'ماسح الفرص', ach: 'الإنجازات' };

const CLOSED_I = ['target', 'stopped', 'expired'];
function ensure() {
  S.watch = S.watch || []; S.alerts = S.alerts || []; S.cap = S.cap || []; S.pins = S.pins || [];
  S.guard = Object.assign({ start: 1000, daily: 5, total: 10, target: 10 }, S.guard || {});
  S.set = Object.assign({ theme: 'auto', balance: 1000, name: '' }, S.set); S.set.notif = Object.assign({ ideas: true, offers: true, community: true }, S.set.notif || {});

function calcOut() {
  const c = ui.c, o = (n, h) => { const e = $('#co' + n); if (e) e.innerHTML = h; };
  const row = (a, b, k) => `<div class="row"><span class="mut">${a}</span><b class="${k || ''}">${b}</b></div>`;
  const ok = c.entry > 0 && c.stop > 0 && c.entry !== c.stop, side = c.stop < c.entry ? 'long' : 'short', mmr = 0.005;
  const liq = (lev) => (side === 'long' ? c.entry * (1 - 1 / lev + mmr) : c.entry * (1 + 1 / lev - mmr));
  if (!ok) { o(1, '<span class="mut">أدخل الدخول والوقف.</span>'); o(2, '<span class="mut">أدخل الدخول والوقف.</span>'); }
  else {
    const risk = (c.bal * c.risk) / 100, fee = (c.fee || 0) / 100, qty = risk / (Math.abs(c.entry - c.stop) + (c.entry + c.stop) * fee), usd = qty * c.entry;
    o(1, row('الاتجاه', SIDE[side], side === 'long' ? 'up' : 'dn') + row('المبلغ المعرّض', f(risk) + ' $') + row('الكمية', f(qty, 6)) + row('الحجم', f(usd) + ' $') + row('الهامش', f(usd / c.lev) + ' $') + row('التصفية التقريبية', f(liq(c.lev), 4), 'dn')
      + ((side === 'long' ? liq(c.lev) >= c.stop : liq(c.lev) <= c.stop) ? '<div class="err">تحذير: التصفية أقرب من الوقف، خفّض الرافعة.</div>' : ''));
    const q2 = ui.c.mode === 'usd' ? c.size / c.entry : c.size, r2 = q2 * Math.abs(c.entry - c.stop);
    o(2, q2 > 0 ? row('الكمية', f(q2, 6)) + row('الحجم', f(q2 * c.entry) + ' $') + row('المخاطرة', f(r2) + ' $', 'dn') + row('نسبة من الرصيد', f((r2 / c.bal) * 100) + '%') : '<span class="mut">أدخل الحجم.</span>');
  }
  const rr = ok && c.tgt > 0 ? Math.abs(c.tgt - c.entry) / Math.abs(c.entry - c.stop) : null;
  o(3, rr == null ? '<span class="mut">أدخل الدخول والوقف والهدف.</span>' : row('R:R', '1 : ' + f(rr)) + row('نسبة الربح اللازمة للتعادل', f(100 / (1 + rr), 1) + '%'));
  const d = c.dd / 100;
  o(4, d > 0 && d < 1 ? row('الربح المطلوب للتعويض', f((d / (1 - d)) * 100, 1) + '%', 'up') + `<div class="mut">${[5, 10, 20, 30, 50].map((x) => x + '% ← ' + f((x / (100 - x)) * 100, 1) + '%').join(' · ')}</div>` : '<span class="mut">أدخل نسبة بين 0 و100.</span>');
}
